<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RadTherapyApps Enterprise — Integrated IGRT Practice Hub</title>
<style>
:root{
  --bg:#0a1119; --chrome:#131d2a; --chrome2:#1b2a3d; --panel:#f7f9fc; --panel2:#eef3f9; --line:#d3dce8;
  --console:#060b12; --console2:#0d1622; --consoleLine:#233244; --ink:#162230; --muted:#60748d;
  --inkDark:#dce6f3; --mutedDark:#88a0ba; --teal:#24c7bf; --teal2:#0f8d87; --green:#2d9f5a; --amber:#d49228; --red:#d45148; --blue:#2f78c4;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace; --ui:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:var(--ui);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{height:100vh;display:grid;grid-template-columns:88px 1fr;grid-template-rows:58px 64px 1fr;background:var(--panel2)}
.sidebar{grid-row:1/4;background:var(--chrome);border-right:1px solid #000;display:flex;flex-direction:column;align-items:stretch;padding-top:8px}
.logo{height:50px;display:grid;place-items:center;color:#fff;border-bottom:1px solid #203145;margin-bottom:4px}
.logo .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:grid;place-items:center;font-weight:900;color:#052422}
.navbtn{border:0;background:none;color:var(--mutedDark);display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;font-size:10px;border-left:3px solid transparent;transition:.12s}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.navbtn:hover{background:#192737;color:#dfe8f5}
.navbtn.active{background:#192737;color:#fff;border-left-color:var(--teal)}
.navbtn.active svg{stroke:var(--teal)}
.sidefoot{margin-top:auto;padding:10px 8px;color:#7e94ae;font-size:9px;line-height:1.5;text-align:center;border-top:1px solid #203145}
.topbar{grid-column:2;background:var(--chrome);color:#fff;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #000;gap:12px}
.brand{font-weight:700;letter-spacing:.03em}
.brand small{display:block;color:#94abc5;font-weight:400;font-size:11px}
.simtag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:#2a2410;border:1px solid #635022;color:#ffd788;font-weight:700}
.topbar .spacer{flex:1}
.topmeta{font-size:12px;color:#b7c6d8}
.patientband{grid-column:2;background:var(--chrome2);color:#fff;border-bottom:1px solid #243548;display:flex;align-items:stretch;min-width:0}
.pb-empty{display:flex;align-items:center;padding:0 18px;color:#8fa3bd;font-style:italic}
.pb-id{display:flex;align-items:center;gap:12px;padding:10px 16px;border-right:1px solid #243548;min-width:250px}
.pb-avatar{width:40px;height:40px;border-radius:7px;background:#33465d;display:grid;place-items:center;font-weight:800;font-size:15px;color:#cfe0f2}
.pb-name{font-size:15px;font-weight:800;line-height:1.1}
.pb-sub{font-size:11px;color:#9db1c8;margin-top:2px}
.pb-fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));flex:1;min-width:0}
.pb-field{padding:8px 12px;border-right:1px solid #243548;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pb-field:last-child{border-right:0}
.pb-field .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#7d92ae}
.pb-field .v{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace{grid-column:2;min-height:0;padding:10px;overflow:hidden}
.view{height:100%;display:none;min-height:0}
.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cardHead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.cardHead h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cardBody{padding:12px}
.btn{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--teal);border-color:var(--teal2);color:#052422}
.btn.primary:hover{background:var(--teal2);color:#fff}
.btn.go{background:var(--green);border-color:#25794a;color:#fff}.btn.go:hover{background:#25794a}
.btn.warn{background:#fbf2dd;border-color:#ead19a;color:#885a0c}.btn.warn:hover{background:#f5e5ba}
.btn.stop{background:#fbe8e6;border-color:#e8bbb6;color:#99261f}.btn.stop:hover{background:#f3d3cf}
.btn.dark{background:#1d2b3d;border-color:var(--consoleLine);color:#dce6f3}.btn.dark:hover{background:#24384f}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:#e8f5ed;color:#1e6a3e}.pill.warn{background:#fbf1dd;color:#8d5c10}.pill.stop{background:#fbe8e6;color:#9a2820}.pill.info{background:#e8f0fa;color:#1e5d96}.pill.idle{background:#e9edf3;color:#62778f}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:700}
/* schedule */
.scheduleGrid{height:100%;display:grid;grid-template-columns:1.1fr 1.1fr .8fr;gap:10px}
.col{display:grid;grid-template-rows:auto 1fr;min-height:0}
.stack{display:grid;grid-auto-rows:1fr;gap:10px;min-height:0}
.patientCard{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.patientCard:last-child{border-bottom:0}
.patientCard .nm{font-size:14px;font-weight:800}
.patientCard .sb{font-size:11px;color:var(--muted);margin-top:2px}
.patientCard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.patientCard .meta span{font-size:11px;background:#eef4fb;border:1px solid #d9e3ef;padding:2px 6px;border-radius:999px}
.patientCard .actions{display:flex;flex-direction:column;gap:6px;justify-content:center}
.miniTable{width:100%;border-collapse:collapse;font-size:11.5px}.miniTable th,.miniTable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}.miniTable th{font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
.help{padding:10px 12px;border:1px dashed #c5d1df;background:#f9fbfd;border-radius:8px;font-size:11.5px;color:var(--muted);line-height:1.45}
/* imaging */
.imagingWrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}
.imagingMain{background:var(--console);border:1px solid var(--consoleLine);border-radius:12px;display:grid;grid-template-rows:auto 1fr;min-height:0;overflow:hidden}
.imgbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--console2);border-bottom:1px solid var(--consoleLine);color:var(--inkDark);flex-wrap:wrap}
.imgbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mutedDark);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--consoleLine);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#182536;color:var(--mutedDark);padding:6px 10px;font-size:11px;font-weight:800}
.seg button.on{background:var(--teal);color:#042420}
.spacer{flex:1}
.paneGrid{padding:10px;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.pane{position:relative;background:#05080c;border:1px solid #1a293b;border-radius:10px;overflow:hidden}
.pane canvas{width:100%;height:100%;display:block;cursor:grab;background:#000}.pane canvas.dragging{cursor:grabbing}
.paneLabel{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;color:#8ed6d6;background:rgba(0,0,0,.45);padding:4px 7px;border-radius:999px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.paneLabel small{display:block;font-size:8.5px;color:#6d95a2;font-weight:600;letter-spacing:0;text-transform:none}
.paneMeta{position:absolute;bottom:8px;right:8px;z-index:2;color:#a8dfe0;text-shadow:0 0 5px #000;font-family:var(--mono);font-size:10px;line-height:1.35;text-align:right}
.paneHint{position:absolute;bottom:8px;left:8px;z-index:2;color:#6d95a2;font-size:10px}
.paneSummary{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--inkDark);gap:8px;background:radial-gradient(circle at 50% 40%,#0f1b28,#081018)}
.paneSummary .cap{font-size:10px;text-transform:uppercase;color:var(--mutedDark);letter-spacing:.08em;font-weight:700}
.paneSummary .big{font-family:var(--mono);font-size:36px;font-weight:900;line-height:1}.paneSummary .big.ok{color:#68d997}.paneSummary .big.warn{color:#f2c26d}.paneSummary .big.bad{color:#ff928a}
.igrtPanel{background:var(--console2);border:1px solid var(--consoleLine);border-radius:12px;color:var(--inkDark);display:grid;grid-template-rows:auto auto auto auto 1fr auto;overflow:hidden}
.igrtSection{padding:10px 12px;border-bottom:1px solid var(--consoleLine)}
.igrtTitle{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mutedDark);font-weight:800;margin-bottom:8px}
.axisCtl{background:#0b131e;border:1px solid #1d3044;border-radius:10px;padding:8px;margin-bottom:7px}
.axisCtl:last-child{margin-bottom:0}
.axisTop{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mutedDark);font-family:var(--mono);margin-bottom:7px}
.axisTop b{color:#fff;font-size:13px}
.nudge{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}.nudge .btn{justify-content:center;padding:6px 4px}
.nudge .step{min-width:44px;text-align:center;font-size:11px;color:var(--mutedDark);font-family:var(--mono)}
.resBox{background:#0b131e;border:1px solid #1d3044;border-radius:10px;padding:8px}.rrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:3px 0}.tol-ok{color:#68d997}.tol-warn{color:#f2c26d}.tol-bad{color:#ff928a}
.statusNote{font-size:11px;color:var(--mutedDark);line-height:1.45}
.btnCol{display:grid;gap:7px;padding:10px 12px}
/* treat */
.treatWrap{height:100%;display:grid;grid-template-columns:360px minmax(0,1fr);gap:10px}
.queuePanel{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.queueList{padding:10px;display:grid;gap:8px;overflow:hidden}
.qitem{background:#0b121c;border:1px solid #203042;border-radius:10px;padding:9px 10px;color:var(--inkDark)}
.qitem.cur{outline:2px solid var(--teal);outline-offset:1px;background:#0c1b1f}
.qitem.done{opacity:.55}
.qitem .id{font-family:var(--mono);font-weight:800;font-size:11px;color:#9ec0dd}.qitem .name{font-size:13px;font-weight:800;margin-top:2px}.qitem .sm{font-size:11px;color:var(--mutedDark);margin-top:2px}
.linacPanel{background:var(--console);border:1px solid var(--consoleLine);border-radius:12px;display:grid;grid-template-rows:auto auto auto 1fr auto;overflow:hidden;min-height:0}
.lbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--console2);border-bottom:1px solid var(--consoleLine);color:var(--inkDark)}
.stateBox{text-align:center;margin:10px 12px;padding:10px;border-radius:10px;border:1px solid #203042;font-weight:900;letter-spacing:.08em}
.state-parked{background:#0b131e;color:#8da1ba}.state-ready{background:#e8f5ed;color:#1b6a3e;border-color:#aed8be}.state-beamon{background:#1d8b50;color:#fff;border-color:#5dd291}.state-interlock{background:#fbe8e6;color:#97231d;border-color:#e3b5b0}.state-complete{background:#e8f0fa;color:#1d5d97;border-color:#b5cae4}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 10px}.meter{background:#0b131e;border:1px solid #203042;border-radius:10px;padding:8px;text-align:center;color:var(--inkDark)}.meter .k{font-size:9px;text-transform:uppercase;color:var(--mutedDark);font-weight:800}.meter .v{font-family:var(--mono);font-size:18px;font-weight:900;margin-top:3px}.meter .v small{display:block;font-size:9px;color:var(--mutedDark);font-weight:700}
.treatGrid{display:grid;grid-template-columns:1fr 200px;gap:10px;padding:0 12px 12px;min-height:0}
.tbl{width:100%;border-collapse:collapse;color:var(--inkDark);font-size:11.5px}.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid #1a293b}.tbl th{font-size:10px;text-transform:uppercase;color:var(--mutedDark);background:#0b131e}.tbl td{font-family:var(--mono)}.tbl td.nm{font-family:var(--ui);font-weight:700;color:#cfe0f2}.tbl tr.delivering{background:#2a2410}.tbl tr.done{background:#0f2417}
.sidebits{display:grid;gap:8px}.ibox{background:#0b131e;border:1px solid #203042;border-radius:10px;padding:8px;color:var(--inkDark)}.ibox .ttl{font-size:10px;text-transform:uppercase;color:var(--mutedDark);font-weight:800;margin-bottom:6px}.irow{display:flex;justify-content:space-between;font-size:11px;padding:3px 0}.irow .ok{color:#6bd897}.irow .bad{color:#ff928a}
.tcontrols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 12px 12px}
/* chart */
.chartWrap{height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.noteList{display:grid;gap:8px}.note{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.note .d{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:4px}

.dicomMode{height:100%;display:grid;grid-template-rows:42px 1fr;background:var(--console);border:1px solid var(--consoleLine);border-radius:12px;overflow:hidden}
.dicomModeBar{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--console2);border-bottom:1px solid var(--consoleLine);color:var(--inkDark)}
.dicomModeBar .title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--mutedDark)}
.dicomFrame{width:100%;height:100%;border:0;background:#06090e;display:block}

@media(max-width:1200px){.pb-fields{grid-template-columns:repeat(3,minmax(0,1fr))}.imagingWrap,.treatWrap,.chartWrap,.scheduleGrid{grid-template-columns:1fr}.paneGrid{grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="mark">R</div></div>
    <button class="navbtn active" data-view="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Schedule</button>
    <button class="navbtn" data-view="imaging"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h18" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="3"/></svg>Imaging</button>
    <button class="navbtn" data-view="treat"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="9" height="13" rx="1"/><rect x="13" y="4" width="9" height="13" rx="1"/><path d="M9 20h6M12 17v3"/></svg>LINAC</button>
    <button class="navbtn" data-view="chart"><svg viewBox="0 0 24 24"><path d="M9 2h6a2 2 0 0 1 2 2H7a2 2 0 0 1 2-2Z"/><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 11h6M9 15h6"/></svg>Chart</button>
    <div class="sidefoot">RadTherapyApps<br>Enterprise<br><span class="mono">IGRT Hub</span></div>
  </aside>

  <div class="topbar">
    <div class="brand">RadTherapyApps Enterprise <small>Integrated IGRT Practice Hub</small></div>
    <span class="simtag">Training Emulator</span>
    <div class="spacer"></div>
    <div class="topmeta">Workflow: <span class="mono" id="wfState">Schedule → Imaging → Treat</span></div>
  </div>

  <div class="patientband" id="patientBand"></div>

  <main class="workspace">
    <section class="view active" id="view-schedule"></section>
    <section class="view" id="view-imaging"></section>
    <section class="view" id="view-treat"></section>
    <section class="view" id="view-chart"></section>
  </main>
</div>

<script>
const TOL=2.0;
const state={view:'schedule',patientId:null};
const PATIENTS={
  'P100247':{mrn:'100247',name:'Wilson, James',dob:'1958-03-12',age:68,sex:'M',site:'Prostate',technique:'VMAT',machine:'LINAC-A',energy:'6 MV',rxDose:6000,fxDose:300,fxTotal:20,fxDone:7,oncologist:'Dr. A. Pereira',allergies:['Penicillin'],flags:['Full bladder / empty rectum'],position:'Supine, kneefix',imaging:'Daily CBCT',setupNote:'Match to prostate + fiducials. 3 gold seeds.',fields:[{id:'CBCT',type:'Setup',energy:'kV',gantry:'0→360',coll:'0.0',mu:0,note:'Volumetric setup'},{id:'ARC1',type:'Treat',energy:'6 MV',gantry:'181→179',coll:'30.0',mu:312,note:'CW VMAT'},{id:'ARC2',type:'Treat',energy:'6 MV',gantry:'179→181',coll:'330.0',mu:298,note:'CCW VMAT'}],couch:{vrt:-3.2,lng:12.6,lat:-0.4,rtn:0},anatomy:'pelvis',notes:['Daily bladder protocol review.','Align to fiducials and soft tissue.','Observe urinary symptom trend weekly.']},
  'P100892':{mrn:'100892',name:'Okafor, Robert',dob:'1965-11-02',age:60,sex:'M',site:'Oropharynx (H&N)',technique:'IMRT',machine:'LINAC-A',energy:'6 MV',rxDose:7000,fxDose:200,fxTotal:35,fxDone:18,oncologist:'Dr. S. Lindqvist',allergies:[],flags:['5-point mask','Daily kV + weekly CBCT'],position:'Supine, S-frame mask',imaging:'Daily kV pair',setupNote:'Match to C2 vertebra and mandible. Watch mask fit.',fields:[{id:'kV-AP',type:'Setup',energy:'kV',gantry:'0',coll:'0.0',mu:0,note:'AP setup'},{id:'kV-LAT',type:'Setup',energy:'kV',gantry:'270',coll:'0.0',mu:0,note:'Lateral setup'},{id:'F1',type:'Treat',energy:'6 MV',gantry:'180',coll:'0.0',mu:142,note:'Step & shoot'},{id:'F2',type:'Treat',energy:'6 MV',gantry:'230',coll:'0.0',mu:131,note:'Step & shoot'},{id:'F3',type:'Treat',energy:'6 MV',gantry:'280',coll:'0.0',mu:118,note:'Step & shoot'},{id:'F4',type:'Treat',energy:'6 MV',gantry:'80',coll:'0.0',mu:127,note:'Step & shoot'},{id:'F5',type:'Treat',energy:'6 MV',gantry:'130',coll:'0.0',mu:139,note:'Step & shoot'}],couch:{vrt:-1.8,lng:24.1,lat:0.6,rtn:0},anatomy:'head',notes:['Assess mask fit and weight loss changes.','Review mucositis / pain management.','Verify bite block and shoulder pull consistency.']},
  'P101455':{mrn:'101455',name:'Vance, Eleanor',dob:'1971-07-19',age:54,sex:'F',site:'Breast (Left)',technique:'Tangents (FiF)',machine:'LINAC-B',energy:'6 MV',rxDose:4005,fxDose:267,fxTotal:15,fxDone:11,oncologist:'Dr. A. Pereira',allergies:['Contrast dye'],flags:['DIBH','Breast board 12.5°'],position:'Supine, breast board, both arms up',imaging:'Daily kV (DIBH)',setupNote:'Match to chest wall / carina. Confirm breath-hold baseline.',fields:[{id:'kV-AP',type:'Setup',energy:'kV',gantry:'0',coll:'0.0',mu:0,note:'AP DIBH'},{id:'MED',type:'Treat',energy:'6 MV',gantry:'305',coll:'0.0',mu:178,note:'Medial tangent'},{id:'LAT',type:'Treat',energy:'6 MV',gantry:'125',coll:'0.0',mu:184,note:'Lateral tangent'}],couch:{vrt:-2.5,lng:9.3,lat:1.2,rtn:0},anatomy:'chest',notes:['Coach breath-hold before imaging and treatment.','Watch skin reaction and arm comfort.','Confirm board angle and indexing.']}
};
const sessions={};
function sess(pid){
  if(!sessions[pid]){
    sessions[pid]={igrtApproved:false,dicomResult:null,delivered:new Set(),con:null};
  }
  return sessions[pid];
}
function activePatient(){return state.patientId?PATIENTS[state.patientId]:null}
function setPatient(pid){state.patientId=pid; sess(pid); updatePatientBand(); renderAll();}
function updatePatientBand(){
  const host=document.getElementById('patientBand'); const p=activePatient();
  if(!p){host.innerHTML='<div class="pb-empty">No active patient in context — choose a practice case from Schedule.</div>'; return;}
  const s=sess(state.patientId); const fxNext=Math.min(p.fxDone+1,p.fxTotal); const status=s.igrtApproved?'IGRT approved':'IGRT pending';
  host.innerHTML=`<div class="pb-id"><div class="pb-avatar">${p.name.split(',')[0][0]}${p.name.split(',')[1].trim()[0]}</div><div><div class="pb-name">${p.name}</div><div class="pb-sub">MRN ${p.mrn} · ${p.site} · ${p.technique}</div></div></div>
  <div class="pb-fields">
    <div class="pb-field"><div class="k">Fraction</div><div class="v">${fxNext} / ${p.fxTotal}</div></div>
    <div class="pb-field"><div class="k">Prescription</div><div class="v">${p.rxDose} cGy · ${p.fxDose} cGy/fx</div></div>
    <div class="pb-field"><div class="k">Machine</div><div class="v">${p.machine}</div></div>
    <div class="pb-field"><div class="k">Imaging</div><div class="v">${p.imaging}</div></div>
    <div class="pb-field"><div class="k">Therapist Goal</div><div class="v">${p.setupNote}</div></div>
    <div class="pb-field"><div class="k">Status</div><div class="v">${status}</div></div>
  </div>`;
}
function switchView(v){state.view=v; document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); document.querySelectorAll('.view').forEach(el=>el.classList.remove('active')); document.getElementById('view-'+v).classList.add('active'); renderAll();}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));

function renderAll(){renderSchedule(); renderImaging(); renderTreat(); renderChart();}

function renderSchedule(){

          <div class="actions"><button class="btn primary" onclick="setPatient('${id}');switchView('imaging')">Image</button><button class="btn" onclick="setPatient('${id}');switchView('chart')">Chart</button><button class="btn go" onclick="setPatient('${id}');switchView('treat')">Treat</button></div>

        <table class="miniTable"><thead><tr><th>Time</th><th>Patient</th><th>Activity</th><th>Machine</th></tr></thead><tbody>

        </tbody></table>
        <div class="help"><b>Suggested use:</b> start with <b>Imaging</b>, identify the hidden random setup error, correct the alignment with couch buttons and mouse dragging, then move to <b>LINAC</b> for console practice. For user-uploaded CT data, launch the dedicated DICOM alignment lab from the Imaging view.</div>

/* ---------- Imaging: embedded DICOM registration workspace ---------- */
function dicomContext(){
  const p=activePatient(); if(!p) return {};
  return {patient:{
    id:state.patientId,mrn:p.mrn,name:p.name,dob:p.dob,age:p.age,sex:p.sex,site:p.site,
    immobilization:p.position,imaging:p.imaging,setupNote:p.setupNote,
    rx:{dose:p.rxDose/100,fractions:p.fxTotal,dosePerFraction:p.fxDose/100,technique:p.technique,energy:p.energy},
    fractionsDelivered:p.fxDone
  }};
}
function sendDicomContext(){
  const fr=document.getElementById('dicomFrame');
  if(fr&&fr.contentWindow) fr.contentWindow.postMessage({type:'RTA_CONTEXT',context:dicomContext()},'*');
}
function renderImaging(){
  const host=document.getElementById('view-imaging'); const p=activePatient();
  if(!p){
    host.innerHTML='<div class="card" style="height:100%;display:grid;place-items:center"><div style="text-align:center;color:var(--muted)">No patient loaded.<br><br><button class="btn primary" onclick="switchView(\'schedule\')">Choose patient from Schedule</button></div></div>';
    return;
  }
  const s=sess(state.patientId);
  host.innerHTML=`<div class="dicomMode">
    <div class="dicomModeBar">
      <div class="title">OIS / IGRT · DICOM Registration Workspace</div>
      <span class="pill info">${p.imaging}</span>
      <span class="pill ${s.igrtApproved?'ok':'warn'}">${s.igrtApproved?'IGRT approved':'Approval pending'}</span>
      <div class="spacer"></div>
      <span class="pill info">${p.name} · MRN ${p.mrn}</span>
      <button class="btn dark" onclick="reloadDicomWorkspace()">Clear / Reload Viewer</button>
    </div>
    <iframe id="dicomFrame" class="dicomFrame" src="dicom-alignment-lab.html?embedded=1" title="OIS DICOM IGRT registration viewer"></iframe>
  </div>`;
  const fr=document.getElementById('dicomFrame');
  if(fr) fr.addEventListener('load',sendDicomContext);
}
function reloadDicomWorkspace(){
  const s=sess(state.patientId); s.igrtApproved=false; s.dicomResult=null;
  updatePatientBand(); renderImaging(); renderTreat(); renderChart();
}
/* ---------- Treat ---------- */
function initConsole(pid){const s=sess(pid), p=PATIENTS[pid]; if(s.con) return s.con; s.con={field:null,door:'open',state:'parked',mu:0,gantryNow:0,actual:{coll:0,vrt:p.couch.vrt,lng:p.couch.lng,lat:p.couch.lat,energy:'—'}}; return s.con;}
function parseGantry(g){if(g.includes('→')){const [a,b]=g.split('→').map(parseFloat); return [a,b];} const v=parseFloat(g); return [v,v];}
function planFor(p,f){const [gs,ge]=parseGantry(f.gantry); return {energy:f.energy,mu:f.mu,gantryStart:gs,gantryStop:ge,coll:parseFloat(f.coll),vrt:p.couch.vrt,lng:p.couch.lng,lat:p.couch.lat};}
function nextTreatField(p,s){return p.fields.find(f=>f.type==='Treat'&&!s.delivered.has(f.id))}
function matched(con,plan){if(!plan) return false; return con.actual.energy===plan.energy && near(con.actual.coll,plan.coll) && near(con.actual.vrt,plan.vrt) && near(con.actual.lng,plan.lng) && near(con.actual.lat,plan.lat) && near(con.gantryNow,plan.gantryStart,1)}
function near(a,b,t=.3){return Math.abs(a-b)<=t}
function refreshConsoleState(){const p=activePatient(); if(!p) return; const s=sess(state.patientId), con=initConsole(state.patientId); if(con.state==='beamon'||con.state==='complete') return; if(con.field===null){con.state='parked'; return;} const plan=planFor(p,p.fields.find(f=>f.id===con.field)); const gated=con.door!=='closed'||!s.igrtApproved||!matched(con,plan); con.state=gated?'interlock':'ready';}
function renderTreat(){const host=document.getElementById('view-treat'); const p=activePatient(); if(!p){host.innerHTML='<div class="card" style="height:100%;display:grid;place-items:center"><div style="text-align:center;color:var(--muted)">No patient loaded.<br><br><button class="btn primary" onclick="switchView(\'schedule\')">Choose patient from Schedule</button></div></div>'; return;} const s=sess(state.patientId), con=initConsole(state.patientId); refreshConsoleState(); const next=nextTreatField(p,s); const fx=p.fxDone+1; const gate=s.igrtApproved?'<span class="pill ok">IGRT approved</span>':'<span class="pill warn">IGRT required before treatment</span>';
  host.innerHTML=`<div class="treatWrap">
    <div class="queuePanel card" style="background:var(--console);border-color:var(--consoleLine)">
      <div class="cardHead" style="background:var(--console2);border-color:var(--consoleLine);color:var(--inkDark)"><h3 style="color:var(--mutedDark)">Record & Verify Queue</h3><div class="spacer"></div>${gate}</div>
      <div class="queueList">${p.fields.map(f=>{const done=s.delivered.has(f.id); const cur=con.field===f.id; return `<div class="qitem ${done?'done':''} ${cur?'cur':''}"><div class="id">${f.id}</div><div class="name">${f.type} · ${f.note}</div><div class="sm">${f.energy} · Gantry ${f.gantry} · MU ${f.mu}</div></div>`}).join('')}</div>
      <div style="padding:10px"><button class="btn ${next?'primary':'go'}" style="width:100%;justify-content:center" onclick="loadNextField()">${next?'Load Next Treat Field':'All treat fields delivered'}</button></div>
    </div>

    <div class="linacPanel">
      <div class="lbar"><strong>${p.machine} · Treatment Console</strong><span class="pill info">Fraction ${fx}/${p.fxTotal}</span><div class="spacer"></div><span class="mono" style="font-size:11px;color:var(--mutedDark)">${p.site}</span></div>
      <div class="stateBox state-${con.state}">${con.state.toUpperCase()}</div>
      <div class="meters">
        <div class="meter"><div class="k">Field</div><div class="v">${con.field||'—'}<small>loaded</small></div></div>
        <div class="meter"><div class="k">MU</div><div class="v">${Math.round(con.mu)}<small>delivered</small></div></div>
        <div class="meter"><div class="k">Door</div><div class="v">${con.door.toUpperCase()}<small>vault</small></div></div>
        <div class="meter"><div class="k">Gantry</div><div class="v">${con.gantryNow.toFixed(1)}<small>degrees</small></div></div>
      </div>
      <div class="treatGrid">
        <div class="card" style="background:#0a1119;border-color:#1a293b"><div class="cardHead" style="background:#0b131e;border-color:#1a293b;color:var(--inkDark)"><h3 style="color:var(--mutedDark)">Planned Parameters</h3></div><div class="cardBody" style="padding:0">
          <table class="tbl"><thead><tr><th>ID</th><th>Type</th><th>Energy</th><th>Gantry</th><th>Coll</th><th>MU</th></tr></thead><tbody>${p.fields.map(f=>`<tr class="${con.field===f.id&&con.state==='beamon'?'delivering':''} ${s.delivered.has(f.id)?'done':''}"><td>${f.id}</td><td class="nm">${f.type}</td><td>${f.energy}</td><td>${f.gantry}</td><td>${f.coll}</td><td>${f.mu}</td></tr>`).join('')}</tbody></table>
        </div></div>
        <div class="sidebits">
          <div class="ibox"><div class="ttl">Interlocks / Readiness</div>
            <div class="irow"><span>IGRT approval</span><span class="${s.igrtApproved?'ok':'bad'}">${s.igrtApproved?'SET':'MISSING'}</span></div>
            <div class="irow"><span>Door closed</span><span class="${con.door==='closed'?'ok':'bad'}">${con.door.toUpperCase()}</span></div>
            <div class="irow"><span>Parameter match</span><span class="${(con.field&&matched(con,planFor(p,p.fields.find(f=>f.id===con.field))))?'ok':'bad'}">${con.field?(matched(con,planFor(p,p.fields.find(f=>f.id===con.field)))?'MATCH':'MISMATCH'):'—'}</span></div>
          </div>
          <div class="ibox"><div class="ttl">Quick Setup</div>
            <div class="irow"><span>Collimator</span><span class="mono">${con.actual.coll.toFixed(1)}</span></div>
            <div class="irow"><span>VRT</span><span class="mono">${con.actual.vrt.toFixed(1)}</span></div>
            <div class="irow"><span>LNG</span><span class="mono">${con.actual.lng.toFixed(1)}</span></div>
            <div class="irow"><span>LAT</span><span class="mono">${con.actual.lat.toFixed(1)}</span></div>
            <div class="irow"><span>Energy</span><span class="mono">${con.actual.energy}</span></div>
          </div>
        </div>
      </div>
      <div class="tcontrols">
        <button class="btn dark" onclick="consoleSetupPlan()">Setup to Plan</button>
        <button class="btn dark" onclick="toggleDoor()">${con.door==='closed'?'Open Door':'Close Door'}</button>
        <button class="btn dark" onclick="beamOn()">Beam On</button>
        <button class="btn dark" onclick="holdBeam()">Hold</button>
        <button class="btn stop" onclick="terminateField()">Complete / Clear</button>
      </div>
    </div>
  </div>`;
}
function loadNextField(){const p=activePatient(), s=sess(state.patientId), con=initConsole(state.patientId); const n=nextTreatField(p,s); if(!n) return; con.field=n.id; con.mu=0; const plan=planFor(p,n); con.gantryNow=plan.gantryStart; con.state='parked'; renderTreat();}
function consoleSetupPlan(){const p=activePatient(), s=sess(state.patientId), con=initConsole(state.patientId); if(!con.field) return; const plan=planFor(p,p.fields.find(f=>f.id===con.field)); con.actual={coll:plan.coll,vrt:plan.vrt,lng:plan.lng,lat:plan.lat,energy:plan.energy}; con.gantryNow=plan.gantryStart; refreshConsoleState(); renderTreat();}
function toggleDoor(){const con=initConsole(state.patientId); con.door=con.door==='closed'?'open':'closed'; refreshConsoleState(); renderTreat();}
function beamOn(){const p=activePatient(), s=sess(state.patientId), con=initConsole(state.patientId); if(!con.field) return; refreshConsoleState(); if(con.state!=='ready') return; const f=p.fields.find(x=>x.id===con.field), plan=planFor(p,f); con.state='beamon'; renderTreat(); const steps=18; let i=0; const iv=setInterval(()=>{i++; con.mu=plan.mu*(i/steps); con.gantryNow=plan.gantryStart + ((plan.gantryStop-plan.gantryStart)*(i/steps)); renderTreat(); if(i>=steps){clearInterval(iv); s.delivered.add(f.id); con.state='complete'; renderTreat();}},120);}
function holdBeam(){const con=initConsole(state.patientId); if(con.state==='beamon') con.state='ready'; renderTreat();}
function terminateField(){const con=initConsole(state.patientId); con.field=null; con.mu=0; con.state='parked'; renderTreat();}

/* ---------- Chart ---------- */
function renderChart(){
  const host=document.getElementById('view-chart'); const p=activePatient();
  if(!p){host.innerHTML='<div class="card" style="height:100%;display:grid;place-items:center"><div style="text-align:center;color:var(--muted)">No patient loaded.<br><br><button class="btn primary" onclick="switchView(\'schedule\')">Choose patient from Schedule</button></div></div>'; return;}
  const s=sess(state.patientId), d=s.dicomResult||{}, c=d.correction||{}, r=d.residual||{}, ds=d.dataset||{};
  const correctionRows=s.dicomResult?`<dt>LAT</dt><dd class="mono">${Number(c.lat||0).toFixed(1)} mm</dd><dt>VRT</dt><dd class="mono">${Number(c.vrt||0).toFixed(1)} mm</dd><dt>LNG</dt><dd class="mono">${Number(c.lng||0).toFixed(1)} mm</dd><dt>Roll</dt><dd class="mono">${Number(c.roll||0).toFixed(1)}°</dd><dt>Pitch</dt><dd class="mono">${Number(c.pitch||0).toFixed(1)}°</dd><dt>Yaw</dt><dd class="mono">${Number(c.yaw||0).toFixed(1)}°</dd><dt>Residual</dt><dd class="mono">${Number(d.maxTranslationResidual||0).toFixed(1)} mm / ${Number(d.maxRotationResidual||0).toFixed(1)}°</dd>`:'<dt>Registration</dt><dd>No approved DICOM match recorded</dd>';
  host.innerHTML=`<div class="chartWrap">
    <div class="card"><div class="cardHead"><h3>Demographics & Plan</h3></div><div class="cardBody">
      <dl class="kv"><dt>Name</dt><dd>${p.name}</dd><dt>MRN</dt><dd>${p.mrn}</dd><dt>Sex</dt><dd>${p.sex}</dd><dt>DOB</dt><dd>${p.dob}</dd><dt>Diagnosis</dt><dd>${p.site}</dd><dt>Technique</dt><dd>${p.technique}</dd><dt>Prescription</dt><dd>${p.rxDose} cGy / ${p.fxTotal} fx</dd><dt>Machine</dt><dd>${p.machine}</dd><dt>Position</dt><dd>${p.position}</dd><dt>Imaging</dt><dd>${p.imaging}</dd><dt>Physician</dt><dd>${p.oncologist}</dd></dl>
    </div></div>
    <div class="card"><div class="cardHead"><h3>DICOM IGRT Session</h3></div><div class="cardBody">
      <div style="display:grid;gap:8px;margin-bottom:10px">${s.igrtApproved?'<span class="pill ok">Approved</span>':'<span class="pill warn">Pending approval</span>'}<span class="pill info">${d.mode||'DICOM registration'}</span></div>
      <dl class="kv"><dt>Dataset patient</dt><dd>${ds.patient||'—'}</dd><dt>Series</dt><dd>${ds.description||'—'}</dd><dt>Modality</dt><dd>${ds.modality||'—'}</dd><dt>Registration mode</dt><dd>${d.mode||'—'}</dd>${correctionRows}</dl>
      <div class="help" style="margin-top:10px">These values are returned directly from the embedded DICOM registration workspace and are used to release the treatment-console IGRT interlock.</div>
    </div></div>
    <div class="card"><div class="cardHead"><h3>Progress Notes</h3></div><div class="cardBody noteList">${p.notes.map((n,i)=>`<div class="note"><div class="d">Teaching note ${i+1}</div>${n}</div>`).join('')}</div></div>
  </div>`;
}

window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.type==='RTA_REQUEST_CONTEXT'&&d.module==='dicom-alignment-lab') sendDicomContext();
  if(d.type==='RTA_MODULE_EVENT'&&d.module==='dicom-alignment-lab'&&state.patientId){
    const s=sess(state.patientId);
    if(d.event==='igrt-approved'){
      s.igrtApproved=true; s.dicomResult=d.detail||{};
      updatePatientBand(); renderTreat(); renderChart();
    }
    if(d.event==='igrt-rejected'){
      s.igrtApproved=false; s.dicomResult=d.detail||null;
      updatePatientBand(); renderTreat(); renderChart();
    }
  }
});

updatePatientBand(); renderAll();
</script>

<style id="rtaModuleBridgeStyle">
#rtaHubRibbon{position:fixed;right:8px;top:8px;z-index:2147483647;display:none;max-width:330px;
background:rgba(7,13,21,.94);color:#dce7f4;border:1px solid rgba(52,214,198,.45);border-radius:9px;
padding:6px 9px;box-shadow:0 8px 24px rgba(0,0,0,.35);font:10px ui-monospace,Consolas,monospace;
pointer-events:none;line-height:1.35}
#rtaHubRibbon b{color:#34d6c6}#rtaHubRibbon span{color:#8fa3bb}
</style>
<div id="rtaHubRibbon"></div>
<script id="rtaModuleBridge">
(function(){
  const MODULE_KEY="integrated-igrt-hub";
  window.RadTherapyBridge={
    context:null,
    emit(event,detail){ parent.postMessage({type:'RTA_MODULE_EVENT',module:MODULE_KEY,event,detail:detail||{}},'*'); }
  };
  function showContext(ctx){
    window.RadTherapyBridge.context=ctx;
    const p=ctx&&ctx.patient, el=document.getElementById('rtaHubRibbon');
    if(!el) return;
    if(!p){el.style.display='none';return;}
    el.style.display='block';
    el.innerHTML='<b>SIMULATED CENTER</b><br>'+String(p.name||'Patient')+
      ' <span>· MRN '+String(p.mrn||p.id||'—')+' · '+String(p.site||'')+'</span>';
    window.dispatchEvent(new CustomEvent('rta:context',{detail:ctx}));
  }
  window.addEventListener('message',ev=>{
    const d=ev.data||{};
    if(d.type==='RTA_CONTEXT') showContext(d.context||{});
  });
  parent.postMessage({type:'RTA_MODULE_READY',module:MODULE_KEY},'*');
  parent.postMessage({type:'RTA_REQUEST_CONTEXT',module:MODULE_KEY},'*');
  
  window.addEventListener('rta:context',ev=>{
    const p=(ev.detail||{}).patient; if(!p||typeof PATIENTS==='undefined') return;
    const id='HUB-'+String(p.mrn||p.id||Date.now());
    if(!PATIENTS[id]){
      PATIENTS[id]={mrn:p.mrn||id,name:p.name||'Center Patient',dob:p.dob||'1970-01-01',
        age:p.age||'',sex:p.sex||'',site:p.site||'Radiation Oncology',technique:(p.rx&&p.rx.technique)||'VMAT',
        machine:'LINAC-A',energy:(p.rx&&p.rx.energy)||'6 MV',rxDose:Number((p.rx&&p.rx.dose)||60)*100,
        fxDose:200,fxTotal:Number((p.rx&&p.rx.fractions)||30),fxDone:Number(p.fractionsDelivered||0),
        oncologist:p.physician||'Teaching Faculty',allergies:[],flags:[],position:p.immobilization||'Per plan',
        imaging:'Daily CBCT',setupNote:'Match per planning directive.',
        fields:[{id:'ARC1',type:'Treat',energy:(p.rx&&p.rx.energy)||'6 MV',gantry:'181→179',coll:'30.0',mu:300,note:'Teaching arc'}],
        couch:{vrt:0,lng:0,lat:0,rtn:0},anatomy:/head|neck|brain/i.test(p.site||'')?'head':/breast|lung|thorax/i.test(p.site||'')?'chest':'pelvis',
        notes:['Imported from Simulated Center patient context.']};
    }
    if(typeof setPatient==='function') setPatient(id);
  });
  try{
    if(typeof approveShift==='function'){
      const _approveShift=approveShift; approveShift=function(){_approveShift.apply(this,arguments);
        window.RadTherapyBridge.emit('igrt-approved',{});};
    }
  }catch(e){}

})();
</script>
